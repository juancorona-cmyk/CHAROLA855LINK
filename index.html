<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naturizable Links</title>
<link rel="icon" type="image/png" href="/assets/logo-blanco.png">
<style>
  :root{
    --bg1:#0b2414;
    --bg2:#163a21;
    --bg3:#1f5130;
    --card:#ffffff;
    --card-hover:#f4fbf6;
    --text:#0f2e1b;
    --muted:#6b7d70;
    --accent:#3fae57;
    --ring:rgba(63,174,87,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
  }
  body{
    height:100vh;
    height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    padding:clamp(12px,4vh,32px) 20px;
    position:fixed;
    inset:0;
    overflow:hidden;
    touch-action:none;
  }
  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:26px 26px;
    pointer-events:none;
  }
  .wrap{
    width:100%;
    max-width:420px;
    max-height:100%;
    text-align:center;
    position:relative;
    z-index:1;
    animation:fadeUp .6s ease both;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .logo-wrap{
    width:clamp(64px,13vh,104px);height:clamp(64px,13vh,104px);
    border-radius:50%;
    background:#ffffff14;
    backdrop-filter:blur(6px);
    border:1px solid #ffffff2a;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto clamp(8px,1.6vh,18px);
    box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 0 rgba(63,174,87,.45);
    padding:14px;
    animation:logoFloat 5s ease-in-out infinite, pulseRing 2.8s ease-out infinite;
  }
  @keyframes logoFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
  }
  @keyframes pulseRing{
    0%{box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 0 rgba(63,174,87,.45);}
    70%{box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 16px rgba(63,174,87,0);}
    100%{box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 0 rgba(63,174,87,0);}
  }
  .logo-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  h1{
    color:#fff;
    font-size:24px;
    font-weight:700;
    margin-bottom:6px;
    letter-spacing:.3px;
  }
  p.sub{
    color:#b9d9c1;
    font-size:14px;
    margin-bottom:clamp(14px,3vh,32px);
    letter-spacing:.2px;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:clamp(8px,1.6vh,14px);
  }
  a.link{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    color:var(--text);
    text-decoration:none;
    padding:clamp(10px,2vh,17px) 20px;
    border-radius:18px;
    font-weight:600;
    font-size:15px;
    box-shadow:0 4px 16px rgba(0,0,0,.18);
    border:1px solid transparent;
    position:relative;
    overflow:hidden;
    opacity:0;
    transform:translateY(16px);
    animation:linkIn .55s cubic-bezier(.2,.8,.2,1) forwards;
    transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease, background .25s ease, border-color .25s ease;
  }
  .links a:nth-child(1){animation-delay:.15s;}
  .links a:nth-child(2){animation-delay:.28s;}
  .links a:nth-child(3){animation-delay:.41s;}
  @keyframes linkIn{
    to{opacity:1; transform:translateY(0);}
  }
  a.link:hover{
    transform:translateY(-4px) scale(1.015);
    box-shadow:0 16px 30px rgba(0,0,0,.3);
    background:var(--card-hover);
    border-color:var(--ring);
  }
  a.link:active{
    transform:translateY(-1px) scale(.99);
  }
  a.link .icon{
    width:42px;
    height:42px;
    flex-shrink:0;
    border-radius:12px;
    background:linear-gradient(135deg,#eafaef,#d9f2df);
    display:flex;align-items:center;justify-content:center;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), background .3s ease;
  }
  a.link:hover .icon{
    transform:rotate(-8deg) scale(1.08);
    background:linear-gradient(135deg,#d9f2df,#bfe9ca);
  }
  a.link .icon svg{
    width:20px;
    height:20px;
    stroke:var(--accent);
  }
  a.link .label{
    flex:1;
    text-align:left;
  }
  a.link .arrow{
    color:var(--muted);
    font-size:16px;
    transition:transform .25s ease, color .25s ease;
  }
  a.link:hover .arrow{
    transform:translateX(4px);
    color:var(--accent);
  }
  a.link::after{
    content:"";
    position:absolute;
    top:50%;left:50%;
    width:0;height:0;
    background:radial-gradient(circle, rgba(63,174,87,.25), transparent 60%);
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
    transition:width .5s ease, height .5s ease, opacity .5s ease;
    opacity:0;
  }
  a.link.ripple::after{
    width:320px;height:320px;
    opacity:1;
  }
  .social-row{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:clamp(10px,2.5vh,20px);
    margin-top:clamp(18px,4vh,46px);
    padding:0 8px;
  }
  .social-row a{
    width:clamp(38px,8vh,46px);
    height:clamp(38px,8vh,46px);
    border-radius:50%;
    background:#ffffff14;
    border:1px solid #ffffff2a;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    opacity:0;
    transform:translateY(10px);
    animation:linkIn .5s cubic-bezier(.2,.8,.2,1) forwards;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), background .25s ease, box-shadow .25s ease;
  }
  .social-row a:nth-child(1){animation-delay:.55s;}
  .social-row a:nth-child(2){animation-delay:.62s;}
  .social-row a:nth-child(3){animation-delay:.69s;}
  .social-row a:nth-child(4){animation-delay:.76s;}
  .social-row a:nth-child(5){animation-delay:.83s;}
  .social-row a:hover{
    transform:translateY(-5px) scale(1.12);
    background:#ffffff28;
    box-shadow:0 8px 18px rgba(0,0,0,.25);
  }
  .social-row svg{
    width:clamp(16px,3.4vh,19px);
    height:clamp(16px,3.4vh,19px);
    stroke:#fff;
    transition:transform .25s ease;
  }
  .social-row a:hover svg{
    transform:scale(1.1);
  }
  footer{
    margin-top:clamp(14px,3vh,34px);
    color:#9fc2a7;
    font-size:12px;
    letter-spacing:.3px;
  }
</style>
</head>
<body>

  <script>
    document.querySelectorAll('a.link').forEach(function(el){
      el.addEventListener('click', function(){
        el.classList.remove('ripple');
        void el.offsetWidth;
        el.classList.add('ripple');
      });
    });
  </script>
</body>
</html>
