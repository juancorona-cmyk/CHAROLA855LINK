<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseno 855 — Naturizable</title>
<link rel="icon" type="image/png" href="/assets/logo-blanco.png">
<meta property="og:title" content="Diseno 855 — 100% Naturizable">
<meta property="og:description" content="Charolas 100% naturales y compostables. Conoce nuestras opciones.">
<meta property="og:image" content="https://charolanaturalizable.com.mx/assets/og-image.png">
<meta property="og:url" content="https://charolanaturalizable.com.mx/diseno-855">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg1:#0b2414;
    --bg2:#163a21;
    --card:#ffffff;
    --text:#0f2e1b;
    --muted:#6b7d70;
    --accent:#3fae57;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    padding:32px 20px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:26px 26px;
    pointer-events:none;
  }
  .wrap{
    width:100%;
    max-width:460px;
    text-align:center;
    position:relative;
    z-index:1;
    animation:fadeUp .6s ease both;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .logo-wrap{
    width:56px;height:56px;
    border-radius:50%;
    background:#ffffff14;
    backdrop-filter:blur(6px);
    border:1px solid #ffffff2a;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    padding:8px;
  }
  .logo-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  h1{
    color:#fff;
    font-size:22px;
    font-weight:700;
    margin-bottom:4px;
    letter-spacing:.3px;
  }
  p.sub{
    color:#b9d9c1;
    font-size:14px;
    margin-bottom:18px;
    letter-spacing:.2px;
  }
  .card{
    position:relative;
    background:var(--card);
    border-radius:26px;
    padding:16px;
    box-shadow:0 25px 60px rgba(0,0,0,.45), 0 0 0 1px #ffffff20;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:-18px;
    border-radius:34px;
    background:radial-gradient(circle at 50% 30%, rgba(63,174,87,.35), transparent 65%);
    filter:blur(10px);
    z-index:-1;
  }
  .card img{
    width:100%;
    display:block;
    border-radius:16px;
    object-fit:cover;
    min-height:50vh;
    max-height:60vh;
  }
  .back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:26px;
    color:#d9f2df;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    padding:12px 22px;
    border-radius:999px;
    background:#ffffff14;
    border:1px solid #ffffff2a;
    transition:transform .2s ease, background .2s ease;
  }
  .back:hover{
    transform:translateY(-2px);
    background:#ffffff28;
  }
  footer{
    margin-top:28px;
    color:#9fc2a7;
    font-size:12px;
    letter-spacing:.3px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-wrap">
      <img src="/assets/logo-blanco.png" alt="Naturizable">
    </div>
    <h1>Diseno 855</h1>
    <p class="sub">100% Naturizable</p>
    <div class="card">
      <img src="/assets/855.png" alt="Diseno Charola 855">
    </div>
    <a class="back" href="/">← Volver al inicio</a>
    <footer>Naturizable 2026</footer>
  </div>
</body>
</html>
